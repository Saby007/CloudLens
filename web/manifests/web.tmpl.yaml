# Applied by `azd deploy web`; see api/manifests/api.tmpl.yaml for the template syntax.
# Traffic: app-routing NGINX (TLS from cert-manager/Let's Encrypt) -> web nginx -> /api/ proxy to the api Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: cloudlens
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: cloudlens
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # Hard spread across nodes, as for the api (see api/manifests/api.tmpl.yaml).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      containers:
        - name: web
          image: {{ index .Env "SERVICE_WEB_IMAGE_NAME" | printf "%q" }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: API_HOST
              value: "api:8000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The image renders its nginx config into conf.d at start-up and keeps its pid and temp files in /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: cloudlens
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: cloudlens
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: cloudlens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# The only rule admitting traffic to the web pods (10-network-policies.yaml denies everything else).
# Operator mode (MEGHKOSHA_AUTH_MODE=operator, Dev only) has no sign-in, so unless the internet cannot reach the app
# unchecked - the ingress is private, or Terraform has limited HTTPS to an IP allow-list; both report
# APP_WEB_INGRESS_RESTRICTED=true - the ingress controller must not reach the web pods: the selector then names a
# namespace that cannot exist - namespace names are lowercase DNS labels - and the rule admits nothing. The app is then
# reached with `kubectl port-forward`, which network policies do not filter.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-ingress
  labels:
    app.kubernetes.io/part-of: cloudlens
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ if and (eq (index .Env "MEGHKOSHA_AUTH_MODE") "operator") (ne (index .Env "APP_WEB_INGRESS_RESTRICTED") "true") }}"Operator-Mode.No-Public-Ingress"{{ else }}"app-routing-system"{{ end }}
      ports:
        - protocol: TCP
          port: 8080
---
# cert-manager sees the issuer annotation, requests the certificate into web-tls and renews it automatically. With
# APP_TLS_CLUSTER_ISSUER=byo there is no annotation: the operator creates the web-tls secret in this namespace, from their
# own CA, and the ingress serves it (see the README). Without that secret the ingress controller serves its built-in
# placeholder certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: cloudlens
  annotations:
    {{ if ne (index .Env "APP_TLS_CLUSTER_ISSUER") "byo" }}cert-manager.io/cluster-issuer: {{ index .Env "APP_TLS_CLUSTER_ISSUER" | printf "%q" }}{{ end }}
spec:
  ingressClassName: {{ index .Env "APP_INGRESS_CLASS" | printf "%q" }}
  tls:
    - hosts:
        - {{ index .Env "APP_INGRESS_HOST" | printf "%q" }}
      secretName: web-tls
  rules:
    - host: {{ index .Env "APP_INGRESS_HOST" | printf "%q" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
